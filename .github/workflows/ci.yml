name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run audit

  offline:
    name: Offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ANTHROPIC_API_KEY: offline-poison-key
      OPENAI_API_KEY: offline-poison-key
      OPENROUTER_API_KEY: offline-poison-key
      TACHIKOMA_RUN_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun run test:package
      - name: Smoke built exports and CLI
        run: |
          bun -e "await import('./packages/core/dist/index.js'); await import('./packages/cli/dist/index.js')"
          bun packages/cli/dist/cli.js --help
          bun packages/cli/dist/cli.js --version
      - name: Verify packed packages in a clean consumer
        run: bun run test:pack
