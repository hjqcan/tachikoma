<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*"
    />
    <title>Tachikoma</title>
    <style>
      /*
       * Tachikoma 视觉系统 v2 —— 颜色即语义：
       *   底盘蓝 = 机器的声音与工具动作；传感红 = 机器请求对世界动手（仅审批）；
       *   机油琥珀 = 记忆。红色从不用作装饰。
       * 机器说话用等宽字，人类用人文无衬线 —— 声音的边界就是审批守住的边界。
       * 表面语言：层级靠底色深浅与留白，不靠描边——边框只留给真正的边界。
       * 信息架构：顶栏只留身份与线程；机器的操作面（工作区/工具/记忆/模型）
       * 全部收进输入卡的工具条。签名元素仍是传感镜头（状态灯三态）。
       */
      :root {
        color-scheme: dark;
        --ground: #15181f;
        --well: #10131a;
        --surface: #1d222c;
        --raised: #252c39;
        --line: #2d3444;
        --line-soft: #262d3b;
        --text: #e6e9f2;
        --text-dim: #99a1b5;
        --text-faint: #5e6679;
        --chassis: #8fa8e8;
        --chassis-strong: #5b79d6;
        --sensor: #e8524a;
        --sensor-deep: #c8433c;
        --oil: #d9a441;
        --mono: ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', monospace;
        --human: -apple-system, 'Avenir Next', 'Helvetica Neue', 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: color-mix(in srgb, var(--chassis-strong) 45%, transparent);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-faint);
        background-clip: padding-box;
        border: 2px solid transparent;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--text);
        font: 14px/1.65 var(--human);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      button {
        font: inherit;
        transition:
          color 0.15s ease,
          background-color 0.15s ease,
          border-color 0.15s ease,
          opacity 0.15s ease;
      }

      /* ── 仪表条：只留身份与状态（hiddenInset 拖拽区） ────── */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        height: 44px;
        flex: none;
        background: var(--ground);
        border-bottom: 1px solid var(--line-soft);
        user-select: none;
        -webkit-app-region: drag;
      }
      body.mac header {
        padding-left: 84px; /* macOS 红绿灯 */
      }
      header button {
        -webkit-app-region: no-drag;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font: 600 12px var(--human);
        letter-spacing: 0.3em;
        color: var(--chassis);
      }
      /* 传感镜头：签名状态灯 */
      .lens {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--chassis);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--chassis) 22%, transparent);
        flex: none;
      }
      body.generating .lens {
        animation: breathe 1.6s ease-in-out infinite;
      }
      body.awaiting-approval .lens {
        background: var(--sensor);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--sensor) 26%, transparent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          box-shadow: 0 0 0 5px color-mix(in srgb, var(--chassis) 14%, transparent);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      #sessions-toggle {
        font: 12px var(--human);
        color: var(--text-dim);
        background: none;
        border: none;
        border-radius: 7px;
        padding: 5px 10px;
        cursor: pointer;
      }
      #sessions-toggle:hover {
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 9%, transparent);
      }
      #sessions-toggle[aria-pressed='true'] {
        color: var(--chassis);
      }
      .spacer {
        flex: 1;
      }
      #status {
        font: 10px var(--mono);
        color: var(--text-faint);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        -webkit-app-region: drag;
      }

      /* ── 主体：会话栏 + 时间线 + 记忆抽屉 ─────────────── */
      #shell {
        flex: 1;
        display: flex;
        overflow: hidden;
        position: relative;
      }
      #sessions {
        width: 264px;
        flex: none;
        background: var(--well);
        display: flex;
        flex-direction: column;
      }
      #sessions[hidden] {
        display: none;
      }
      .aside-head {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 12px 10px;
      }
      #new-session {
        width: 100%;
        font: 600 12px var(--human);
        background: var(--raised);
        color: var(--chassis);
        border: none;
        border-radius: 8px;
        padding: 8px 0;
        cursor: pointer;
      }
      #new-session:hover {
        background: color-mix(in srgb, var(--chassis) 16%, var(--raised));
      }
      #session-filter {
        font: 11px var(--mono);
        color: var(--text);
        background: var(--ground);
        border: none;
        border-radius: 7px;
        padding: 6px 10px;
        outline: none;
      }
      #session-filter:focus {
        box-shadow: 0 0 0 1px var(--chassis-strong) inset;
      }
      #session-filter::placeholder {
        color: var(--text-faint);
      }
      #session-list {
        flex: 1;
        overflow-y: auto;
        padding: 2px 8px 10px;
      }
      .session-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 1px 0;
        padding: 7px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .session-row:hover {
        background: color-mix(in srgb, var(--chassis) 8%, transparent);
      }
      .session-row.current {
        background: color-mix(in srgb, var(--chassis) 13%, transparent);
      }
      .session-row.current .session-title {
        color: var(--chassis);
      }
      .session-title {
        flex: 1;
        min-width: 0;
        font: 13px var(--human);
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session-title input {
        font: 13px var(--human);
        color: var(--text);
        background: var(--ground);
        border: 1px solid var(--chassis-strong);
        border-radius: 5px;
        padding: 1px 6px;
        outline: none;
        width: 100%;
      }
      .session-meta {
        flex: none;
        font: 10px var(--mono);
        color: var(--text-faint);
      }
      .session-row:hover .session-meta {
        visibility: hidden; /* 悬停让位给垃圾桶 */
      }
      .session-row .confirm-bar {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding: 0 8px;
        background: var(--raised);
        border-radius: 8px;
      }
      .confirm-bar button {
        font: 600 11px var(--human);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
        border: none;
      }
      .confirm-bar .yes {
        background: var(--sensor-deep);
        color: #fff;
      }
      .confirm-bar .yes:hover {
        background: var(--sensor);
      }
      .confirm-bar .no {
        background: none;
        color: var(--text-dim);
      }
      .confirm-bar .no:hover {
        color: var(--text);
      }
      /* 后台会话状态点：生成中呼吸、完成未读常亮 */
      .session-row .state-dot {
        display: none;
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--chassis);
      }
      .session-row.busy .state-dot {
        display: block;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .session-row.unread .state-dot {
        display: block;
      }
      .session-row .del {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        background: none;
        border: none;
        color: var(--sensor);
        cursor: pointer;
        opacity: 0;
        padding: 5px;
        border-radius: 6px;
      }
      .session-row:hover .del,
      .session-row .del:focus-visible {
        opacity: 0.75;
      }
      .session-row .del:hover {
        opacity: 1;
        background: color-mix(in srgb, var(--sensor) 14%, transparent);
      }

      /* ── 时间线 ─────────────────────────────────────── */
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 30px 0 40px;
        scroll-behavior: smooth;
      }
      #log > * {
        max-width: 78ch;
        margin-left: auto;
        margin-right: auto;
        padding-left: 32px;
        padding-right: 32px;
      }
      .turn {
        margin-bottom: 30px;
        animation: rise 0.18s ease-out;
        position: relative;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }
      /* 人的声音：右侧气泡 */
      .turn.you {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 24px;
      }
      .turn.you .bubble {
        max-width: 86%;
        background: color-mix(in srgb, var(--chassis-strong) 22%, var(--surface));
        border-radius: 14px 14px 4px 14px;
        padding: 9px 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* 机器的声音：左侧正文，等宽 */
      .turn.machine .role {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: 600 9px var(--human);
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: color-mix(in srgb, var(--chassis) 70%, transparent);
        margin-bottom: 9px;
      }
      .turn.machine .role::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--chassis) 55%, transparent);
      }
      .turn.machine .body {
        font: 13px/1.8 var(--mono);
      }

      /* 机器声音里的 Markdown */
      .body .md-p {
        margin: 0 0 11px;
        white-space: pre-wrap;
      }
      .body > :last-child {
        margin-bottom: 0;
      }
      .body .md-h {
        font-weight: 700;
        color: var(--text);
        margin: 18px 0 9px;
      }
      .body .md-h1 {
        font-size: 15px;
        border-bottom: 1px solid var(--line-soft);
        padding-bottom: 6px;
      }
      .body .md-h2 {
        font-size: 14px;
      }
      .body .md-h3,
      .body .md-h4 {
        font-size: 13px;
        color: var(--chassis);
      }
      .body ul,
      .body ol {
        margin: 0 0 11px;
        padding-left: 22px;
      }
      .body li {
        margin: 4px 0;
      }
      .body li::marker {
        color: var(--text-faint);
      }
      .body code {
        font: 12px var(--mono);
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 9%, transparent);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .body pre.code {
        margin: 0 0 12px;
        padding: 11px 13px;
        background: var(--well);
        border-radius: 10px;
        overflow-x: auto;
        position: relative;
      }
      .body pre.code code {
        background: none;
        color: var(--text);
        padding: 0;
        font: 12px/1.6 var(--mono);
        white-space: pre;
      }
      .body blockquote {
        margin: 0 0 11px;
        padding: 2px 0 2px 12px;
        border-left: 2px solid var(--line);
        color: var(--text-dim);
        white-space: pre-wrap;
      }
      .body hr {
        border: none;
        border-top: 1px solid var(--line-soft);
        margin: 14px 0;
      }
      .body a {
        color: var(--chassis);
        text-decoration: underline;
        text-decoration-color: color-mix(in srgb, var(--chassis) 45%, transparent);
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .body a:hover {
        text-decoration-color: var(--chassis);
      }
      .body strong {
        color: var(--text);
        font-weight: 700;
      }

      /* 复制：机器回合 hover / 代码块右上角 */
      .copy-turn,
      .code-copy {
        font: 10px var(--mono);
        color: var(--text-faint);
        background: var(--raised);
        border: none;
        border-radius: 6px;
        padding: 3px 9px;
        cursor: pointer;
        opacity: 0;
      }
      .copy-turn {
        position: absolute;
        top: -4px;
        right: 32px;
      }
      .turn.machine:hover .copy-turn,
      .copy-turn:focus-visible {
        opacity: 1;
      }
      .copy-turn:hover,
      .code-copy:hover {
        color: var(--chassis);
      }
      .code-copy {
        position: absolute;
        top: 7px;
        right: 7px;
      }
      .body pre.code:hover .code-copy {
        opacity: 1;
      }

      details.thinking {
        margin: 2px 0 10px;
      }
      details.thinking summary {
        font: 11px var(--mono);
        color: var(--text-faint);
        cursor: pointer;
        list-style: none;
        transition: color 0.15s ease;
      }
      details.thinking summary:hover {
        color: var(--text-dim);
      }
      details.thinking summary::before {
        content: '▸ ';
      }
      details[open].thinking summary::before {
        content: '▾ ';
      }
      details.thinking div {
        font: 11px/1.6 var(--mono);
        color: var(--text-dim);
        border-left: 1px solid var(--line);
        padding-left: 12px;
        margin-top: 6px;
        max-height: 180px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      /* ── 空状态 ─────────────────────────────────────── */
      .hero {
        margin-top: 17vh;
        text-align: center;
        animation: rise 0.3s ease-out;
      }
      .hero .hero-lens {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        margin: 0 auto 18px;
        border: 2px solid color-mix(in srgb, var(--chassis) 45%, transparent);
        position: relative;
      }
      .hero .hero-lens::after {
        content: '';
        position: absolute;
        inset: 9px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--chassis) 65%, transparent);
      }
      .hero .hero-title {
        font: 600 14px var(--human);
        color: var(--text-dim);
        margin-bottom: 10px;
      }
      .hero .hero-hint {
        font: 11px/2 var(--mono);
        color: var(--text-faint);
      }

      /* ── 工具遥测：单行状态芯片，可展开（底盘蓝左轨） ── */
      details.tool {
        margin: 8px auto;
      }
      details.tool summary {
        display: flex;
        align-items: baseline;
        gap: 10px;
        list-style: none;
        cursor: pointer;
        font: 12px var(--mono);
        background: var(--surface);
        border-left: 2px solid var(--chassis-strong);
        border-radius: 9px;
        padding: 7px 12px;
        transition: background-color 0.15s ease;
      }
      details.tool summary:hover {
        background: var(--raised);
      }
      details.tool summary .name {
        color: var(--chassis);
        flex: none;
      }
      details.tool summary .args {
        color: var(--text-faint);
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      details.tool summary .verdict {
        color: var(--text-dim);
        flex: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 40%;
      }
      details.tool summary .verdict.run {
        color: var(--chassis);
        animation: pulse 1.4s ease-in-out infinite;
      }
      details.tool summary .verdict.err {
        color: var(--sensor);
      }
      details.tool summary .dur {
        color: var(--text-faint);
        font-size: 10px;
        flex: none;
      }
      details.tool summary .chev {
        color: var(--text-faint);
        font-size: 10px;
        flex: none;
        transition: transform 0.15s ease;
      }
      details[open].tool summary .chev {
        transform: rotate(180deg);
      }
      details.tool pre {
        margin: 6px 0 2px;
        padding: 9px 12px;
        background: var(--well);
        border-radius: 9px;
        max-height: 240px;
        overflow: auto;
        font: 11px/1.55 var(--mono);
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-all;
      }
      details.tool pre:empty {
        display: none;
      }

      /* ── 审批卡：传感红，机器在等你 ─────────────────── */
      .approval {
        border-left: 3px solid var(--sensor-deep);
        border-radius: 12px;
        padding: 13px 16px;
        margin: 14px auto;
        background: color-mix(in srgb, var(--sensor) 7%, var(--surface));
      }
      .approval .ask {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 600 13px var(--human);
      }
      .approval .eye {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--sensor);
        flex: none;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .approval.resolved {
        border-left-color: var(--line);
        background: var(--surface);
      }
      .approval.resolved .eye {
        animation: none;
        background: var(--text-faint);
      }
      .approval code {
        font: 12px var(--mono);
        color: var(--sensor);
      }
      .approval pre {
        font: 11px/1.55 var(--mono);
        background: var(--well);
        border-radius: 8px;
        padding: 9px 11px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 10px 0;
      }
      .approval .path {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin-top: 8px;
      }
      .approval pre.diff-old,
      details.changes pre.diff-old {
        border-left: 2px solid var(--line);
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .approval pre.diff-old::before,
      .approval pre.diff-new::before,
      details.changes pre.diff-old::before,
      details.changes pre.diff-new::before {
        display: block;
        font-size: 10px;
        letter-spacing: 0.18em;
        margin-bottom: 4px;
      }
      .approval pre.diff-old::before,
      details.changes pre.diff-old::before {
        content: '− 旧';
        color: var(--text-dim);
      }
      .approval pre.diff-new,
      details.changes pre.diff-new {
        border-left: 2px solid var(--chassis-strong);
        margin-top: 0;
      }
      .approval pre.diff-new::before,
      details.changes pre.diff-new::before {
        content: '+ 新';
        color: var(--chassis);
      }
      .approval .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }
      .approval button {
        font: 600 12px var(--human);
        border-radius: 8px;
        padding: 6px 18px;
        cursor: pointer;
        border: none;
      }
      .approval button.approve {
        background: var(--sensor-deep);
        color: #fff;
      }
      .approval button.approve:hover {
        background: var(--sensor);
      }
      .approval button.deny {
        background: var(--raised);
        color: var(--text);
      }
      .approval button.deny:hover {
        background: color-mix(in srgb, var(--text-faint) 25%, var(--raised));
      }
      .approval .verdict-line {
        font: 12px var(--mono);
        color: var(--text-dim);
        margin-top: 8px;
      }

      /* ── 回合收口卡：这一回合改了什么（含行数账） ────── */
      details.changes {
        background: var(--surface);
        border-left: 2px solid var(--chassis-strong);
        border-radius: 9px;
        padding: 8px 12px;
        margin: 10px auto;
      }
      details.changes summary {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font: 12px var(--mono);
        color: var(--chassis);
        cursor: pointer;
        list-style: none;
      }
      details.changes summary .delta {
        color: var(--text-faint);
        font-size: 11px;
      }
      details.changes summary .delta .plus {
        color: #7fbf7f;
      }
      details.changes summary .delta .minus {
        color: var(--sensor);
      }
      details.changes .change {
        margin-top: 10px;
      }
      details.changes .change-head {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      details.changes pre {
        font: 11px/1.55 var(--mono);
        background: var(--well);
        border-radius: 8px;
        padding: 8px 10px;
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 6px 0;
      }
      details.changes .path {
        font: 11px var(--mono);
        color: var(--text-dim);
      }

      /* ── 状态行 / 分隔线 / 召回行 ───────────────────── */
      .status-line {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin: 8px auto;
      }
      .status-line.memory {
        color: var(--oil);
      }
      .status-line.error {
        color: var(--sensor);
      }
      .session-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 10px var(--mono);
        color: var(--text-faint);
        margin: 20px auto;
        white-space: nowrap;
      }
      .session-divider::before,
      .session-divider::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--line-soft);
        min-width: 24px;
      }
      details.recall {
        margin: 8px auto;
      }
      details.recall summary {
        font: 11px var(--mono);
        color: var(--oil);
        cursor: pointer;
        list-style: none;
      }
      details.recall summary::before {
        content: '⟡ ';
      }
      details.recall .hit {
        font: 11px/1.55 var(--mono);
        color: var(--text-dim);
        border-left: 1px solid color-mix(in srgb, var(--oil) 45%, transparent);
        padding-left: 12px;
        margin: 6px 0 0 2px;
      }
      details.recall .hit .kind {
        color: var(--oil);
        margin-right: 8px;
      }

      /* ── 滚到底：悬浮镜头按钮 ───────────────────────── */
      #to-bottom {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: var(--raised);
        color: var(--text-dim);
        font: 14px var(--human);
        cursor: pointer;
        box-shadow: 0 6px 18px #0007;
        z-index: 5;
      }
      #to-bottom:hover {
        color: var(--chassis);
      }
      #to-bottom[hidden] {
        display: none;
      }

      /* ── 记忆抽屉：机油琥珀 ─────────────────────────── */
      #memory {
        width: 300px;
        flex: none;
        background: var(--well);
        display: flex;
        flex-direction: column;
      }
      #memory[hidden] {
        display: none;
      }
      .memory-head {
        padding: 12px 12px 10px;
      }
      #memory-search {
        width: 100%;
        font: 11px var(--mono);
        color: var(--text);
        background: var(--ground);
        border: none;
        border-radius: 7px;
        padding: 6px 10px;
        outline: none;
      }
      #memory-search:focus {
        box-shadow: 0 0 0 1px var(--oil) inset;
      }
      #memory-search::placeholder {
        color: var(--text-faint);
      }
      #memory-list {
        flex: 1;
        overflow-y: auto;
        padding: 2px 8px 8px;
      }
      .memory-group {
        font: 600 10px var(--human);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: color-mix(in srgb, var(--oil) 75%, var(--text-dim));
        padding: 12px 8px 4px;
      }
      .memory-row {
        position: relative;
        margin: 1px 0;
        padding: 7px 30px 7px 10px;
        border-left: 2px solid color-mix(in srgb, var(--oil) 40%, transparent);
        border-radius: 7px;
        transition: background-color 0.15s ease;
      }
      .memory-row:hover {
        background: color-mix(in srgb, var(--oil) 7%, transparent);
      }
      .memory-row .content {
        font: 12px/1.5 var(--human);
        color: var(--text);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }
      .memory-row .meta {
        font: 10px var(--mono);
        color: var(--text-faint);
        margin-top: 3px;
      }
      .memory-row .del {
        position: absolute;
        right: 4px;
        top: 6px;
        display: flex;
        background: none;
        border: none;
        color: var(--sensor);
        cursor: pointer;
        opacity: 0;
        padding: 4px;
        border-radius: 6px;
      }
      .memory-row:hover .del,
      .memory-row .del:focus-visible {
        opacity: 0.75;
      }
      .memory-row .del:hover {
        opacity: 1;
        background: color-mix(in srgb, var(--sensor) 14%, transparent);
      }
      .memory-row .confirm-bar {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .memory-empty {
        font: 11px var(--mono);
        color: var(--text-faint);
        text-align: center;
        padding: 28px 14px;
      }
      .memory-foot {
        padding: 8px 12px 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #memory-clear {
        font: 11px var(--human);
        color: var(--text-faint);
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px 4px;
      }
      #memory-clear:hover {
        color: var(--sensor);
      }
      .memory-foot .confirm-bar {
        display: flex;
        gap: 6px;
      }
      #memory-toggle {
        font: 12px var(--mono);
        color: var(--text-dim);
        background: none;
        border: none;
        border-radius: 7px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #memory-toggle:hover {
        color: var(--oil);
        background: color-mix(in srgb, var(--oil) 10%, transparent);
      }
      #memory-toggle[aria-pressed='true'] {
        color: var(--oil);
        background: color-mix(in srgb, var(--oil) 12%, transparent);
      }

      /* ── 输入卡：一张完整的卡，机器的操作面都在这 ────── */
      footer {
        flex: none;
        padding: 10px 18px 14px;
        background: var(--ground);
      }
      .composer {
        max-width: 78ch;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        padding: 10px 12px 8px;
        transition: border-color 0.15s ease;
      }
      .composer:focus-within {
        border-color: var(--chassis-strong);
      }
      #input {
        display: block;
        width: 100%;
        font: 14px/1.55 var(--human);
        color: var(--text);
        background: none;
        border: none;
        padding: 2px 4px 6px;
        outline: none;
        resize: none;
        max-height: 180px;
      }
      #input::placeholder {
        color: var(--text-faint);
      }
      .composer .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        position: relative;
      }
      .toolbar button,
      .toolbar select {
        font: 11px var(--mono);
        color: var(--text-dim);
        background: none;
        border: none;
        border-radius: 7px;
        padding: 4px 8px;
        outline: none;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition:
          color 0.15s ease,
          background-color 0.15s ease;
      }
      #workspace-chip {
        max-width: 22ch;
      }
      #model-chip {
        max-width: 18ch;
      }
      #thinking {
        max-width: 17ch;
      }
      .toolbar button:hover,
      .toolbar select:hover {
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 9%, transparent);
      }
      #workspace-chip.granted {
        color: var(--chassis);
      }
      #toolset {
        display: flex;
        gap: 2px;
        flex: none;
      }
      #toolset button.active {
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 14%, transparent);
      }
      /* 上下文用量仪表：>70% 转琥珀并给出压缩入口 */
      #ctx-gauge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: 10px var(--mono);
        color: var(--text-faint);
        margin-right: 4px;
      }
      #ctx-gauge[hidden] {
        display: none;
      }
      #ctx-gauge .bar {
        width: 48px;
        height: 4px;
        border-radius: 2px;
        background: var(--line-soft);
        overflow: hidden;
      }
      #ctx-gauge .fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--chassis-strong);
        transition: width 0.3s ease;
      }
      #ctx-gauge.warn .fill {
        background: var(--oil);
      }
      #ctx-gauge.warn .pct {
        color: var(--oil);
      }
      #compact-now {
        font: 10px var(--mono);
        color: var(--oil);
        background: color-mix(in srgb, var(--oil) 10%, transparent);
        border: none;
        border-radius: 6px;
        padding: 2px 8px;
        cursor: pointer;
      }
      #compact-now:hover {
        background: color-mix(in srgb, var(--oil) 18%, transparent);
      }
      /* 圆形发送键：↑ 发送 / ■ 停止（传感红） */
      #send {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: none;
        background: var(--chassis-strong);
        color: #fff;
        font: 600 14px/1 var(--human);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-left: 6px;
      }
      #send:hover {
        background: var(--chassis);
        color: var(--ground);
      }
      #send.generating {
        background: var(--sensor-deep);
        font-size: 11px;
      }
      #send.generating:hover {
        background: var(--sensor);
        color: #fff;
      }

      /* 模型选择面板：主题内自绘 */
      #model-picker {
        position: absolute;
        bottom: calc(100% + 14px);
        right: 0;
        width: 46ch;
        max-height: 320px;
        display: flex;
        flex-direction: column;
        background: var(--raised);
        border-radius: 12px;
        box-shadow: 0 14px 40px #000a;
        overflow: hidden;
        z-index: 10;
        animation: rise 0.14s ease-out;
      }
      #model-picker[hidden] {
        display: none;
      }
      #model-filter {
        font: 12px var(--mono);
        color: var(--text);
        background: var(--well);
        border: none;
        padding: 10px 13px;
        outline: none;
      }
      #model-filter::placeholder {
        color: var(--text-faint);
      }
      #model-options {
        overflow-y: auto;
        padding: 4px 0;
      }
      .model-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font: 11px var(--mono);
        color: var(--text);
        padding: 6px 13px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        transition: background-color 0.12s ease;
      }
      .model-row span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .model-row:hover {
        background: color-mix(in srgb, var(--chassis) 10%, transparent);
      }
      .model-row.active {
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 7%, transparent);
      }
      .model-row .tag {
        margin-left: auto;
        color: var(--chassis);
        font-size: 10px;
        border: 1px solid color-mix(in srgb, var(--chassis) 35%, transparent);
        border-radius: 999px;
        padding: 0 7px;
        flex: none;
      }
      .model-row .ctx {
        color: var(--text-faint);
        font-size: 10px;
        flex: none;
      }
      .model-row.hint {
        color: var(--text-faint);
        cursor: default;
      }
      .model-row.hint:hover {
        background: none;
      }

      button:focus-visible {
        outline: 2px solid var(--chassis);
        outline-offset: 1px;
      }
      #input:focus-visible {
        outline: none; /* 输入卡整体 focus-within 变色，内框多余 */
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        #log {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="wordmark"><span class="lens"></span>TACHIKOMA</span>
      <button id="sessions-toggle" aria-pressed="true" title="会话列表（⌘B）">会话</button>
      <span class="spacer"></span>
      <span id="status">connecting…</span>
    </header>
    <div id="shell">
      <aside id="sessions">
        <div class="aside-head">
          <button id="new-session" title="⌘N">＋ 新会话</button>
          <input id="session-filter" spellcheck="false" placeholder="过滤会话…" />
        </div>
        <div id="session-list"></div>
      </aside>
      <main id="log"></main>
      <button id="to-bottom" hidden title="回到最新">↓</button>
      <aside id="memory" hidden>
        <div class="memory-head">
          <input id="memory-search" spellcheck="false" placeholder="搜索记忆…" />
        </div>
        <div id="memory-list"></div>
        <div class="memory-foot">
          <button id="memory-clear">清空全部记忆</button>
        </div>
      </aside>
    </div>
    <footer>
      <div class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="发消息…（Enter 发送，Shift+Enter 换行）"
          autofocus
        ></textarea>
        <div class="toolbar">
          <button id="workspace-chip" title="选择工作区，授予工具权限">无工作区 · 零工具</button>
          <span id="toolset">
            <button data-toolset="read-only" class="active" title="read / grep / find / ls">
              只读
            </button>
            <button data-toolset="coding" title="加 write / edit / bash，逐次审批">编码</button>
          </span>
          <button id="memory-toggle" aria-pressed="false" title="记忆（⌘M）">记忆</button>
          <span class="spacer"></span>
          <span id="ctx-gauge" hidden title="上下文用量（上回合 tokens / 模型窗口）">
            <span class="bar"><span class="fill"></span></span>
            <span class="pct"></span>
            <button id="compact-now" hidden title="压缩会话历史，腾出上下文">压缩</button>
          </span>
          <button id="model-chip" title="切换模型">model…</button>
          <div id="model-picker" hidden>
            <input id="model-filter" spellcheck="false" placeholder="过滤模型…（provider/model）" />
            <div id="model-options"></div>
          </div>
          <select id="thinking" title="thinking 深度">
            <option value="off">思考 off</option>
            <option value="minimal">思考 minimal</option>
            <option value="low">思考 low</option>
            <option value="medium">思考 medium</option>
            <option value="high">思考 high</option>
            <option value="xhigh">思考 xhigh</option>
            <option value="max">思考 max</option>
          </select>
          <button id="send" title="发送（Enter）">↑</button>
        </div>
      </div>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
