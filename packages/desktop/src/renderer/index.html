<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*"
    />
    <title>Tachikoma</title>
    <style>
      /*
       * Tachikoma 视觉系统 —— 颜色即语义：
       *   底盘蓝 = 机器的声音与工具动作；传感红 = 机器请求对世界动手（仅审批）；
       *   机油琥珀 = 记忆事件。红色从不用作装饰。
       * 机器说话用等宽字，人类用人文无衬线 —— 声音的边界就是审批守住的边界。
       */
      :root {
        color-scheme: dark;
        --ground: #171a21;
        --surface: #1f242e;
        --line: #303747;
        --text: #e4e8f1;
        --text-dim: #8b93a7;
        --chassis: #8fa8e8;
        --chassis-strong: #5b79d6;
        --sensor: #e8524a;
        --sensor-deep: #c8433c;
        --oil: #d9a441;
        --mono: ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', monospace;
        --human: -apple-system, 'Avenir Next', 'Helvetica Neue', 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--text);
        font: 14px/1.65 var(--human);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ── 仪表条 ─────────────────────────────────────── */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        user-select: none;
        flex-wrap: wrap;
      }
      .wordmark {
        font: 600 12px var(--human);
        letter-spacing: 0.32em;
        color: var(--chassis);
      }
      .wordmark::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--chassis);
        margin-right: 10px;
        vertical-align: 1px;
      }
      #workspace-chip {
        font: 12px var(--mono);
        color: var(--text-dim);
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
        cursor: pointer;
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #workspace-chip:hover {
        border-color: var(--chassis);
        color: var(--chassis);
      }
      #workspace-chip.granted {
        color: var(--chassis);
        border-color: var(--chassis-strong);
      }
      #toolset {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
      }
      #toolset button {
        font: 12px var(--mono);
        background: none;
        border: none;
        color: var(--text-dim);
        padding: 4px 12px;
        cursor: pointer;
      }
      #toolset button.active {
        background: var(--chassis-strong);
        color: #fff;
      }
      .spacer {
        flex: 1;
      }
      #status {
        font: 11px var(--mono);
        color: var(--text-dim);
        text-align: right;
      }

      /* ── 主体：会话栏 + 对话日志 ─────────────────────── */
      #shell {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      #sessions-toggle {
        font: 12px var(--mono);
        color: var(--text-dim);
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
        cursor: pointer;
      }
      #sessions-toggle:hover {
        border-color: var(--chassis);
        color: var(--chassis);
      }
      #sessions {
        width: 270px;
        flex: none;
        border-right: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
      }
      #sessions[hidden] {
        display: none;
      }
      .aside-head {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      #new-session {
        width: 100%;
        font: 600 12px var(--human);
        background: none;
        color: var(--chassis);
        border: 1px dashed var(--chassis-strong);
        border-radius: 6px;
        padding: 7px 0;
        cursor: pointer;
      }
      #new-session:hover {
        background: color-mix(in srgb, var(--chassis) 10%, transparent);
      }
      #session-list {
        flex: 1;
        overflow-y: auto;
      }
      .session-row {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .session-row:hover {
        background: color-mix(in srgb, var(--chassis) 7%, transparent);
      }
      .session-row.current {
        border-left: 2px solid var(--chassis-strong);
        background: color-mix(in srgb, var(--chassis) 5%, transparent);
      }
      .session-title {
        font: 13px var(--human);
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session-meta {
        font: 10px var(--mono);
        color: var(--text-dim);
        margin-top: 3px;
      }

      /* ── 对话日志 ───────────────────────────────────── */
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 28px 0 40px;
      }
      #log > * {
        max-width: 74ch;
        margin-left: auto;
        margin-right: auto;
        padding-left: 24px;
        padding-right: 24px;
      }
      .turn {
        margin-bottom: 26px;
        animation: rise 0.18s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }
      .role {
        font: 600 10px var(--human);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 6px;
      }
      .turn.machine .role {
        color: var(--chassis);
      }
      .turn.you .body {
        white-space: pre-wrap;
      }
      .turn.machine .body {
        font: 13px/1.7 var(--mono);
        white-space: pre-wrap;
      }
      details.thinking {
        margin: 4px 0 8px;
      }
      details.thinking summary {
        font: 11px var(--mono);
        color: var(--text-dim);
        cursor: pointer;
        list-style: none;
      }
      details.thinking summary::before {
        content: '▸ ';
      }
      details[open].thinking summary::before {
        content: '▾ ';
      }
      details.thinking div {
        font: 11px/1.6 var(--mono);
        color: var(--text-dim);
        border-left: 1px solid var(--line);
        padding-left: 12px;
        margin-top: 6px;
        max-height: 180px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      /* ── 工具遥测：底盘蓝左轨 ───────────────────────── */
      .tool {
        border-left: 2px solid var(--chassis-strong);
        padding: 2px 0 2px 14px;
        margin: 10px auto;
        font: 12px var(--mono);
        color: var(--text-dim);
      }
      .tool .head {
        color: var(--chassis);
      }
      .tool .head .verdict {
        color: var(--text-dim);
      }
      .tool .head .verdict.err {
        color: var(--sensor);
      }
      .tool pre {
        margin: 6px 0 2px;
        padding: 8px 10px;
        background: var(--surface);
        border-radius: 6px;
        max-height: 200px;
        overflow: auto;
        font: 11px/1.55 var(--mono);
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-all;
      }

      /* ── 审批卡：传感红，机器在等你 ─────────────────── */
      .approval {
        border: 1px solid var(--sensor-deep);
        border-left-width: 3px;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 14px auto;
        background: color-mix(in srgb, var(--sensor) 6%, var(--surface));
      }
      .approval .ask {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 600 13px var(--human);
      }
      .approval .eye {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--sensor);
        flex: none;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .approval .eye {
          animation: none;
        }
        .turn {
          animation: none;
        }
      }
      .approval.resolved .eye {
        animation: none;
        background: var(--text-dim);
      }
      .approval code {
        font: 12px var(--mono);
        color: var(--sensor);
      }
      .approval pre {
        font: 11px/1.55 var(--mono);
        background: var(--ground);
        border-radius: 6px;
        padding: 8px 10px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 10px 0;
      }
      .approval .path {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin-top: 8px;
      }
      .approval pre.diff-old {
        border-left: 2px solid var(--line);
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .approval pre.diff-old::before,
      .approval pre.diff-new::before {
        display: block;
        font-size: 10px;
        letter-spacing: 0.18em;
        margin-bottom: 4px;
      }
      .approval pre.diff-old::before {
        content: '− 旧';
        color: var(--text-dim);
      }
      .approval pre.diff-new {
        border-left: 2px solid var(--chassis-strong);
        margin-top: 0;
      }
      .approval pre.diff-new::before {
        content: '+ 新';
        color: var(--chassis);
      }
      .approval .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .approval button {
        font: 600 12px var(--human);
        border-radius: 6px;
        padding: 6px 18px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .approval button.approve {
        background: var(--sensor-deep);
        color: #fff;
      }
      .approval button.approve:hover {
        background: var(--sensor);
      }
      .approval button.deny {
        background: none;
        border-color: var(--line);
        color: var(--text);
      }
      .approval button.deny:hover {
        border-color: var(--text-dim);
      }
      .approval .verdict-line {
        font: 12px var(--mono);
        color: var(--text-dim);
      }

      /* ── 状态与分隔 ─────────────────────────────────── */
      .status-line {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin: 8px auto;
      }
      .status-line.memory {
        color: var(--oil);
      }
      .status-line.error {
        color: var(--sensor);
      }
      .session-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 11px var(--mono);
        color: var(--text-dim);
        margin: 22px auto;
      }
      .session-divider::before,
      .session-divider::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--line);
      }

      /* ── 输入区：人类的材质 ─────────────────────────── */
      footer {
        display: flex;
        gap: 10px;
        padding: 14px 18px 16px;
        border-top: 1px solid var(--line);
        background: var(--surface);
      }
      footer .inner {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        max-width: 74ch;
        margin: 0 auto;
      }
      footer .compose {
        display: flex;
        gap: 10px;
      }
      footer .params {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      footer .params input,
      footer .params select {
        font: 11px var(--mono);
        color: var(--text-dim);
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
        outline: none;
      }
      footer .params input {
        width: 34ch;
      }
      footer .params input:focus,
      footer .params select:focus {
        border-color: var(--chassis-strong);
        color: var(--text);
      }
      #input {
        flex: 1;
        font: 14px var(--human);
        color: var(--text);
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 12px;
        outline: none;
      }
      #input:focus {
        border-color: var(--chassis-strong);
      }
      #send {
        font: 600 13px var(--human);
        background: var(--chassis-strong);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0 20px;
        cursor: pointer;
      }
      #send:hover {
        background: var(--chassis);
        color: var(--ground);
      }
      /* 生成中送出键变为"停止"：传感红——人对机器行动的即时控制权 */
      #send.generating {
        background: var(--sensor-deep);
      }
      #send.generating:hover {
        background: var(--sensor);
        color: #fff;
      }
      button:focus-visible,
      #workspace-chip:focus-visible,
      #input:focus-visible {
        outline: 2px solid var(--chassis);
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="wordmark">TACHIKOMA</span>
      <button id="sessions-toggle" title="会话列表">会话</button>
      <button id="workspace-chip" title="选择工作区，授予工具权限">无工作区 · 零工具</button>
      <span id="toolset">
        <button data-toolset="read-only" class="active" title="read / grep / find / ls">
          只读
        </button>
        <button data-toolset="coding" title="加 write / edit / bash，逐次审批">编码</button>
      </span>
      <span class="spacer"></span>
      <span id="status">connecting…</span>
    </header>
    <div id="shell">
      <aside id="sessions" hidden>
        <div class="aside-head">
          <button id="new-session">＋ 新会话</button>
        </div>
        <div id="session-list"></div>
      </aside>
      <main id="log"></main>
    </div>
    <footer>
      <span class="inner">
        <span class="compose">
          <input id="input" placeholder="发消息…（Enter 发送）" autofocus />
          <button id="send">发送</button>
        </span>
        <span class="params">
          <input
            id="model-input"
            list="models-list"
            spellcheck="false"
            placeholder="model…"
            title="切换模型（provider/model，可输入过滤）"
          />
          <datalist id="models-list"></datalist>
          <select id="thinking" title="thinking 深度">
            <option value="off">thinking: off</option>
            <option value="minimal">thinking: minimal</option>
            <option value="low">thinking: low</option>
            <option value="medium">thinking: medium</option>
            <option value="high">thinking: high</option>
            <option value="xhigh">thinking: xhigh</option>
            <option value="max">thinking: max</option>
          </select>
        </span>
      </span>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
