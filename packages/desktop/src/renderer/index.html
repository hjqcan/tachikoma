<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*"
    />
    <title>Tachikoma</title>
    <style>
      /*
       * Tachikoma 视觉系统 —— 颜色即语义：
       *   底盘蓝 = 机器的声音与工具动作；传感红 = 机器请求对世界动手（仅审批）；
       *   机油琥珀 = 记忆事件。红色从不用作装饰。
       * 机器说话用等宽字，人类用人文无衬线 —— 声音的边界就是审批守住的边界。
       * 签名元素：传感镜头（wordmark 的圆点）——空闲静止、生成中底盘蓝呼吸、
       * 待审批传感红脉动。一个母题，三个语义态。
       */
      :root {
        color-scheme: dark;
        --ground: #171a21;
        --well: #12151b;
        --surface: #1f242e;
        --raised: #262c39;
        --line: #303747;
        --line-soft: #272d3a;
        --text: #e4e8f1;
        --text-dim: #8b93a7;
        --text-faint: #5c6478;
        --chassis: #8fa8e8;
        --chassis-strong: #5b79d6;
        --sensor: #e8524a;
        --sensor-deep: #c8433c;
        --oil: #d9a441;
        --mono: ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', monospace;
        --human: -apple-system, 'Avenir Next', 'Helvetica Neue', 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: color-mix(in srgb, var(--chassis-strong) 45%, transparent);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-faint);
        background-clip: padding-box;
        border: 2px solid transparent;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--text);
        font: 14px/1.65 var(--human);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      button {
        transition:
          color 0.15s ease,
          background-color 0.15s ease,
          border-color 0.15s ease,
          opacity 0.15s ease;
      }

      /* ── 仪表条（hiddenInset 标题栏的拖拽区） ─────────────── */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        height: 46px;
        flex: none;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        user-select: none;
        -webkit-app-region: drag;
      }
      body.mac header {
        padding-left: 84px; /* macOS 红绿灯 */
      }
      header button,
      header select {
        -webkit-app-region: no-drag;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font: 600 12px var(--human);
        letter-spacing: 0.32em;
        color: var(--chassis);
      }
      /* 传感镜头：签名状态灯 */
      .lens {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--chassis);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--chassis) 22%, transparent);
        flex: none;
      }
      body.generating .lens {
        animation: breathe 1.6s ease-in-out infinite;
      }
      body.awaiting-approval .lens {
        background: var(--sensor);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--sensor) 26%, transparent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          box-shadow: 0 0 0 5px color-mix(in srgb, var(--chassis) 14%, transparent);
        }
      }
      #workspace-chip,
      #sessions-toggle {
        font: 12px var(--mono);
        color: var(--text-dim);
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
        cursor: pointer;
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #workspace-chip:hover,
      #sessions-toggle:hover {
        border-color: var(--chassis);
        color: var(--chassis);
      }
      #sessions-toggle[aria-pressed='true'] {
        color: var(--chassis);
        border-color: var(--chassis-strong);
        background: color-mix(in srgb, var(--chassis) 10%, transparent);
      }
      #workspace-chip.granted {
        color: var(--chassis);
        border-color: var(--chassis-strong);
      }
      #toolset {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
        -webkit-app-region: no-drag;
      }
      #toolset button {
        font: 12px var(--mono);
        background: none;
        border: none;
        color: var(--text-dim);
        padding: 4px 12px;
        cursor: pointer;
      }
      #toolset button:hover {
        color: var(--chassis);
      }
      #toolset button.active {
        background: var(--chassis-strong);
        color: #fff;
      }
      .spacer {
        flex: 1;
      }
      #status {
        font: 11px var(--mono);
        color: var(--text-faint);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── 主体：会话栏 + 对话日志 ─────────────────────── */
      #shell {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      #sessions {
        width: 272px;
        flex: none;
        border-right: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
      }
      #sessions[hidden] {
        display: none;
      }
      .aside-head {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line-soft);
      }
      #session-filter {
        font: 11px var(--mono);
        color: var(--text);
        background: var(--ground);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 4px 10px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      #session-filter:focus {
        border-color: var(--chassis-strong);
      }
      #session-filter::placeholder {
        color: var(--text-faint);
      }
      .session-title input {
        font: 13px var(--human);
        color: var(--text);
        background: var(--ground);
        border: 1px solid var(--chassis-strong);
        border-radius: 4px;
        padding: 1px 6px;
        outline: none;
        width: 100%;
      }
      #new-session {
        width: 100%;
        font: 600 12px var(--human);
        background: none;
        color: var(--chassis);
        border: 1px solid var(--chassis-strong);
        border-radius: 7px;
        padding: 7px 0;
        cursor: pointer;
      }
      #new-session:hover {
        background: color-mix(in srgb, var(--chassis) 12%, transparent);
      }
      #session-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }
      .session-row {
        position: relative;
        margin: 1px 6px;
        padding: 8px 30px 8px 10px;
        border-left: 2px solid transparent;
        border-radius: 7px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .session-row:hover {
        background: color-mix(in srgb, var(--chassis) 8%, transparent);
      }
      .session-row.current {
        border-left-color: var(--chassis-strong);
        background: color-mix(in srgb, var(--chassis) 10%, transparent);
      }
      .session-row.current .session-title {
        color: var(--chassis);
      }
      /* 后台会话状态点：生成中呼吸、完成未读常亮（悬停时让位给垃圾桶） */
      .session-row .state-dot {
        display: none;
        position: absolute;
        right: 11px;
        top: 13px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--chassis);
      }
      .session-row.busy .state-dot {
        display: block;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .session-row.unread .state-dot {
        display: block;
      }
      .session-row:hover .state-dot {
        display: none;
      }
      .session-row .del {
        position: absolute;
        right: 6px;
        top: 8px;
        display: flex;
        background: none;
        border: none;
        color: var(--sensor);
        cursor: pointer;
        opacity: 0;
        padding: 5px;
        border-radius: 5px;
      }
      .session-row:hover .del,
      .session-row .del:focus-visible {
        opacity: 0.75;
      }
      .session-row .del:hover {
        opacity: 1;
        background: color-mix(in srgb, var(--sensor) 14%, transparent);
      }
      .session-row .confirm-bar {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .confirm-bar button {
        font: 600 11px var(--human);
        border-radius: 5px;
        padding: 3px 10px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .confirm-bar .yes {
        background: var(--sensor-deep);
        color: #fff;
      }
      .confirm-bar .yes:hover {
        background: var(--sensor);
      }
      .confirm-bar .no {
        background: none;
        border-color: var(--line);
        color: var(--text-dim);
      }
      .confirm-bar .no:hover {
        border-color: var(--text-dim);
        color: var(--text);
      }
      .session-title {
        font: 13px var(--human);
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session-meta {
        font: 10px var(--mono);
        color: var(--text-faint);
        margin-top: 3px;
      }

      /* ── 记忆抽屉：机油琥珀——机器的长期记忆可见、可管理 ── */
      #memory-toggle {
        font: 12px var(--mono);
        color: var(--text-dim);
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 14px;
        cursor: pointer;
      }
      #memory-toggle:hover {
        border-color: var(--oil);
        color: var(--oil);
      }
      #memory-toggle[aria-pressed='true'] {
        color: var(--oil);
        border-color: color-mix(in srgb, var(--oil) 65%, transparent);
        background: color-mix(in srgb, var(--oil) 10%, transparent);
      }
      #memory {
        width: 300px;
        flex: none;
        border-left: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
      }
      #memory[hidden] {
        display: none;
      }
      .memory-head {
        padding: 12px;
        border-bottom: 1px solid var(--line-soft);
      }
      #memory-search {
        width: 100%;
        font: 11px var(--mono);
        color: var(--text);
        background: var(--ground);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 5px 10px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      #memory-search:focus {
        border-color: var(--oil);
      }
      #memory-search::placeholder {
        color: var(--text-faint);
      }
      #memory-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0 8px;
      }
      .memory-group {
        font: 600 10px var(--human);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: color-mix(in srgb, var(--oil) 75%, var(--text-dim));
        padding: 12px 14px 4px;
      }
      .memory-row {
        position: relative;
        margin: 1px 6px;
        padding: 7px 30px 7px 10px;
        border-left: 2px solid color-mix(in srgb, var(--oil) 40%, transparent);
        border-radius: 6px;
        transition: background-color 0.15s ease;
      }
      .memory-row:hover {
        background: color-mix(in srgb, var(--oil) 7%, transparent);
      }
      .memory-row .content {
        font: 12px/1.5 var(--human);
        color: var(--text);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }
      .memory-row .meta {
        font: 10px var(--mono);
        color: var(--text-faint);
        margin-top: 3px;
      }
      .memory-row .del {
        position: absolute;
        right: 6px;
        top: 7px;
        display: flex;
        background: none;
        border: none;
        color: var(--sensor);
        cursor: pointer;
        opacity: 0;
        padding: 4px;
        border-radius: 5px;
      }
      .memory-row:hover .del,
      .memory-row .del:focus-visible {
        opacity: 0.75;
      }
      .memory-row .del:hover {
        opacity: 1;
        background: color-mix(in srgb, var(--sensor) 14%, transparent);
      }
      .memory-empty {
        font: 11px var(--mono);
        color: var(--text-faint);
        text-align: center;
        padding: 28px 14px;
      }
      .memory-foot {
        border-top: 1px solid var(--line-soft);
        padding: 8px 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #memory-clear {
        font: 11px var(--human);
        color: var(--text-faint);
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px 4px;
      }
      #memory-clear:hover {
        color: var(--sensor);
      }
      .memory-foot .confirm-bar {
        display: flex;
        gap: 6px;
      }

      /* 时间线里的召回行：琥珀，可展开命中明细 */
      details.recall {
        margin: 8px auto;
      }
      details.recall summary {
        font: 11px var(--mono);
        color: var(--oil);
        cursor: pointer;
        list-style: none;
      }
      details.recall summary::before {
        content: '⟡ ';
      }
      details.recall .hit {
        font: 11px/1.55 var(--mono);
        color: var(--text-dim);
        border-left: 1px solid color-mix(in srgb, var(--oil) 45%, transparent);
        padding-left: 12px;
        margin: 6px 0 0 2px;
      }
      details.recall .hit .kind {
        color: var(--oil);
        margin-right: 8px;
      }

      /* ── 对话日志 ───────────────────────────────────── */
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 26px 0 44px;
        scroll-padding-bottom: 44px;
      }
      #log > * {
        max-width: 76ch;
        margin-left: auto;
        margin-right: auto;
        padding-left: 28px;
        padding-right: 28px;
      }
      .turn {
        margin-bottom: 28px;
        animation: rise 0.18s ease-out;
        position: relative;
      }
      /* 机器回合 hover 复制原文；代码块右上角复制 */
      .copy-turn,
      .code-copy {
        font: 10px var(--mono);
        color: var(--text-faint);
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        padding: 2px 8px;
        cursor: pointer;
        opacity: 0;
      }
      .copy-turn {
        position: absolute;
        top: -2px;
        right: 28px;
      }
      .turn.machine:hover .copy-turn,
      .copy-turn:focus-visible {
        opacity: 1;
      }
      .copy-turn:hover,
      .code-copy:hover {
        color: var(--chassis);
        border-color: var(--chassis);
      }
      .body pre.code {
        position: relative;
      }
      .body pre.code:hover .code-copy {
        opacity: 1;
      }
      .code-copy {
        position: absolute;
        top: 6px;
        right: 6px;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }
      .role {
        font: 600 10px var(--human);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin-bottom: 7px;
      }
      .turn.machine .role {
        color: var(--chassis);
      }
      .turn.you .body {
        white-space: pre-wrap;
        color: var(--text);
      }
      .turn.machine .body {
        font: 13px/1.75 var(--mono);
      }

      /* 机器声音里的 Markdown：等宽为底，结构轻起伏 */
      .body .md-p {
        margin: 0 0 10px;
        white-space: pre-wrap;
      }
      .body > :last-child {
        margin-bottom: 0;
      }
      .body .md-h {
        font-weight: 700;
        color: var(--text);
        margin: 16px 0 8px;
      }
      .body .md-h1 {
        font-size: 15px;
        border-bottom: 1px solid var(--line-soft);
        padding-bottom: 6px;
      }
      .body .md-h2 {
        font-size: 14px;
      }
      .body .md-h3,
      .body .md-h4 {
        font-size: 13px;
        color: var(--chassis);
      }
      .body ul,
      .body ol {
        margin: 0 0 10px;
        padding-left: 22px;
      }
      .body li {
        margin: 3px 0;
      }
      .body li::marker {
        color: var(--text-faint);
      }
      .body code {
        font: 12px var(--mono);
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 9%, transparent);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .body pre.code {
        margin: 0 0 12px;
        padding: 10px 12px;
        background: var(--well);
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        overflow-x: auto;
      }
      .body pre.code code {
        background: none;
        color: var(--text);
        padding: 0;
        font: 12px/1.6 var(--mono);
        white-space: pre;
      }
      .body blockquote {
        margin: 0 0 10px;
        padding: 2px 0 2px 12px;
        border-left: 2px solid var(--line);
        color: var(--text-dim);
        white-space: pre-wrap;
      }
      .body hr {
        border: none;
        border-top: 1px solid var(--line-soft);
        margin: 14px 0;
      }
      .body a {
        color: var(--chassis);
        text-decoration: underline;
        text-decoration-color: color-mix(in srgb, var(--chassis) 45%, transparent);
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .body a:hover {
        text-decoration-color: var(--chassis);
      }
      .body strong {
        color: var(--text);
        font-weight: 700;
      }

      details.thinking {
        margin: 4px 0 10px;
      }
      details.thinking summary {
        font: 11px var(--mono);
        color: var(--text-faint);
        cursor: pointer;
        list-style: none;
        transition: color 0.15s ease;
      }
      details.thinking summary:hover {
        color: var(--text-dim);
      }
      details.thinking summary::before {
        content: '▸ ';
      }
      details[open].thinking summary::before {
        content: '▾ ';
      }
      details.thinking div {
        font: 11px/1.6 var(--mono);
        color: var(--text-dim);
        border-left: 1px solid var(--line);
        padding-left: 12px;
        margin-top: 6px;
        max-height: 180px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      /* ── 空状态：机器就绪，等待第一句话 ───────────────── */
      .hero {
        margin-top: 16vh;
        text-align: center;
        animation: rise 0.3s ease-out;
      }
      .hero .hero-lens {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        margin: 0 auto 18px;
        border: 2px solid color-mix(in srgb, var(--chassis) 45%, transparent);
        position: relative;
      }
      .hero .hero-lens::after {
        content: '';
        position: absolute;
        inset: 9px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--chassis) 65%, transparent);
      }
      .hero .hero-title {
        font: 600 14px var(--human);
        color: var(--text-dim);
        margin-bottom: 10px;
      }
      .hero .hero-hint {
        font: 11px/2 var(--mono);
        color: var(--text-faint);
      }

      /* ── 工具遥测：底盘蓝左轨 ───────────────────────── */
      .tool {
        border-left: 2px solid var(--chassis-strong);
        padding: 2px 0 2px 14px;
        margin: 10px auto;
        font: 12px var(--mono);
        color: var(--text-dim);
      }
      .tool .head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .tool .head .name {
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 10%, transparent);
        border-radius: 4px;
        padding: 0 6px;
        flex: none;
      }
      .tool .head .args {
        color: var(--text-faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tool .head .verdict {
        color: var(--text-dim);
        flex: none;
      }
      .tool .head .verdict.err {
        color: var(--sensor);
      }
      .tool pre {
        margin: 6px 0 2px;
        padding: 8px 10px;
        background: var(--well);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        max-height: 200px;
        overflow: auto;
        font: 11px/1.55 var(--mono);
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-all;
        cursor: pointer;
      }
      .tool pre.expanded {
        max-height: none;
      }

      /* 回合收口卡：这一回合机器改了哪些文件（底盘蓝，工具动作的总账） */
      details.changes {
        border: 1px solid var(--line);
        border-left: 3px solid var(--chassis-strong);
        border-radius: 8px;
        background: var(--surface);
        padding: 10px 14px;
        margin: 12px auto;
      }
      details.changes summary {
        font: 600 12px var(--human);
        color: var(--chassis);
        cursor: pointer;
        list-style: none;
      }
      details.changes .change {
        margin-top: 10px;
      }
      details.changes .change-head {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      details.changes pre {
        font: 11px/1.55 var(--mono);
        background: var(--well);
        border-radius: 6px;
        padding: 8px 10px;
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 6px 0;
      }
      details.changes pre.diff-old {
        border-left: 2px solid var(--line);
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      details.changes pre.diff-old::before,
      details.changes pre.diff-new::before {
        display: block;
        font-size: 10px;
        letter-spacing: 0.18em;
        margin-bottom: 4px;
      }
      details.changes pre.diff-old::before {
        content: '− 旧';
        color: var(--text-dim);
      }
      details.changes pre.diff-new {
        border-left: 2px solid var(--chassis-strong);
        margin-top: 0;
      }
      details.changes pre.diff-new::before {
        content: '+ 新';
        color: var(--chassis);
      }
      details.changes .path {
        font: 11px var(--mono);
        color: var(--text-dim);
      }

      /* ── 审批卡：传感红，机器在等你 ─────────────────── */
      .approval {
        border: 1px solid var(--sensor-deep);
        border-left-width: 3px;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 14px auto;
        background: color-mix(in srgb, var(--sensor) 6%, var(--surface));
      }
      .approval .ask {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 600 13px var(--human);
      }
      .approval .eye {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--sensor);
        flex: none;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      .approval.resolved {
        border-color: var(--line);
        background: var(--surface);
      }
      .approval.resolved .eye {
        animation: none;
        background: var(--text-faint);
      }
      .approval code {
        font: 12px var(--mono);
        color: var(--sensor);
      }
      .approval pre {
        font: 11px/1.55 var(--mono);
        background: var(--well);
        border-radius: 6px;
        padding: 8px 10px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 10px 0;
      }
      .approval .path {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin-top: 8px;
      }
      .approval pre.diff-old {
        border-left: 2px solid var(--line);
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .approval pre.diff-old::before,
      .approval pre.diff-new::before {
        display: block;
        font-size: 10px;
        letter-spacing: 0.18em;
        margin-bottom: 4px;
      }
      .approval pre.diff-old::before {
        content: '− 旧';
        color: var(--text-dim);
      }
      .approval pre.diff-new {
        border-left: 2px solid var(--chassis-strong);
        margin-top: 0;
      }
      .approval pre.diff-new::before {
        content: '+ 新';
        color: var(--chassis);
      }
      .approval .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }
      .approval button {
        font: 600 12px var(--human);
        border-radius: 6px;
        padding: 6px 18px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .approval button.approve {
        background: var(--sensor-deep);
        color: #fff;
      }
      .approval button.approve:hover {
        background: var(--sensor);
      }
      .approval button.deny {
        background: none;
        border-color: var(--line);
        color: var(--text);
      }
      .approval button.deny:hover {
        border-color: var(--text-dim);
      }
      .approval .verdict-line {
        font: 12px var(--mono);
        color: var(--text-dim);
        margin-top: 8px;
      }

      /* ── 状态与分隔 ─────────────────────────────────── */
      .status-line {
        font: 11px var(--mono);
        color: var(--text-dim);
        margin: 8px auto;
      }
      .status-line.memory {
        color: var(--oil);
      }
      .status-line.error {
        color: var(--sensor);
      }
      .session-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 11px var(--mono);
        color: var(--text-faint);
        margin: 22px auto;
        white-space: nowrap;
      }
      .session-divider::before,
      .session-divider::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--line-soft);
        min-width: 24px;
      }

      /* ── 输入区：人类的材质 ─────────────────────────── */
      footer {
        flex: none;
        padding: 12px 18px 12px;
        border-top: 1px solid var(--line);
        background: var(--surface);
      }
      footer .inner {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 76ch;
        margin: 0 auto;
        padding: 0 10px;
      }
      footer .compose {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      #input {
        flex: 1;
        font: 14px/1.55 var(--human);
        color: var(--text);
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 12px;
        outline: none;
        resize: none;
        max-height: 168px;
        transition: border-color 0.15s ease;
      }
      #input:focus {
        border-color: var(--chassis-strong);
      }
      #input::placeholder {
        color: var(--text-faint);
      }
      #send {
        font: 600 13px var(--human);
        background: var(--chassis-strong);
        color: #fff;
        border: none;
        border-radius: 9px;
        padding: 9px 20px;
        cursor: pointer;
        flex: none;
      }
      #send:hover {
        background: var(--chassis);
        color: var(--ground);
      }
      /* 生成中送出键变为"停止"：传感红——人对机器行动的即时控制权 */
      #send.generating {
        background: var(--sensor-deep);
      }
      #send.generating:hover {
        background: var(--sensor);
        color: #fff;
      }
      footer .params {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        position: relative;
      }
      footer .params button,
      footer .params select {
        font: 11px var(--mono);
        color: var(--text-dim);
        background: none;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 3px 10px;
        outline: none;
        cursor: pointer;
        max-width: 40ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }
      footer .params button:hover,
      footer .params select:hover {
        border-color: var(--chassis);
        color: var(--chassis);
      }
      footer .params button:focus-visible,
      footer .params select:focus-visible {
        border-color: var(--chassis-strong);
        color: var(--text);
      }

      /* 模型选择面板：主题内自绘（原生 datalist 会被预填值过滤成单条 + 白底跳戏） */
      #model-picker {
        position: absolute;
        bottom: calc(100% + 10px);
        right: 0;
        width: 46ch;
        max-height: 320px;
        display: flex;
        flex-direction: column;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: 0 12px 36px #000a;
        overflow: hidden;
        z-index: 10;
        animation: rise 0.14s ease-out;
      }
      #model-picker[hidden] {
        display: none;
      }
      #model-filter {
        font: 12px var(--mono);
        color: var(--text);
        background: var(--well);
        border: none;
        border-bottom: 1px solid var(--line);
        padding: 9px 12px;
        outline: none;
      }
      #model-filter::placeholder {
        color: var(--text-faint);
      }
      #model-options {
        overflow-y: auto;
        padding: 4px 0;
      }
      .model-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font: 11px var(--mono);
        color: var(--text);
        padding: 6px 12px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        transition: background-color 0.12s ease;
      }
      .model-row span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .model-row:hover {
        background: color-mix(in srgb, var(--chassis) 10%, transparent);
      }
      .model-row.active {
        color: var(--chassis);
        background: color-mix(in srgb, var(--chassis) 7%, transparent);
      }
      .model-row .tag {
        margin-left: auto;
        color: var(--chassis);
        font-size: 10px;
        border: 1px solid color-mix(in srgb, var(--chassis) 35%, transparent);
        border-radius: 999px;
        padding: 0 7px;
        flex: none;
      }
      .model-row.hint {
        color: var(--text-faint);
        cursor: default;
      }
      .model-row.hint:hover {
        background: none;
      }

      button:focus-visible,
      #workspace-chip:focus-visible {
        outline: 2px solid var(--chassis);
        outline-offset: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="wordmark"><span class="lens"></span>TACHIKOMA</span>
      <button id="sessions-toggle" aria-pressed="true" title="会话列表（⌘B）">会话</button>
      <button id="workspace-chip" title="选择工作区，授予工具权限">无工作区 · 零工具</button>
      <span id="toolset">
        <button data-toolset="read-only" class="active" title="read / grep / find / ls">
          只读
        </button>
        <button data-toolset="coding" title="加 write / edit / bash，逐次审批">编码</button>
      </span>
      <span class="spacer"></span>
      <button id="memory-toggle" aria-pressed="false" title="记忆（⌘M）">记忆</button>
      <span id="status">connecting…</span>
    </header>
    <div id="shell">
      <aside id="sessions">
        <div class="aside-head">
          <button id="new-session" title="⌘N">＋ 新会话</button>
          <input id="session-filter" spellcheck="false" placeholder="过滤会话…" />
        </div>
        <div id="session-list"></div>
      </aside>
      <main id="log"></main>
      <aside id="memory" hidden>
        <div class="memory-head">
          <input id="memory-search" spellcheck="false" placeholder="搜索记忆…" />
        </div>
        <div id="memory-list"></div>
        <div class="memory-foot">
          <button id="memory-clear">清空全部记忆</button>
        </div>
      </aside>
    </div>
    <footer>
      <span class="inner">
        <span class="compose">
          <textarea
            id="input"
            rows="1"
            placeholder="发消息…（Enter 发送，Shift+Enter 换行）"
            autofocus
          ></textarea>
          <button id="send">发送</button>
        </span>
        <span class="params">
          <button id="model-chip" title="切换模型">model…</button>
          <div id="model-picker" hidden>
            <input id="model-filter" spellcheck="false" placeholder="过滤模型…（provider/model）" />
            <div id="model-options"></div>
          </div>
          <select id="thinking" title="thinking 深度">
            <option value="off">thinking: off</option>
            <option value="minimal">thinking: minimal</option>
            <option value="low">thinking: low</option>
            <option value="medium">thinking: medium</option>
            <option value="high">thinking: high</option>
            <option value="xhigh">thinking: xhigh</option>
            <option value="max">thinking: max</option>
          </select>
        </span>
      </span>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
