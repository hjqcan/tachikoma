<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*"
    />
    <title>Tachikoma</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font:
          14px/1.6 system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 8px 16px;
        border-bottom: 1px solid #8884;
        font-size: 12px;
        opacity: 0.8;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      .turn {
        margin-bottom: 16px;
        white-space: pre-wrap;
      }
      .role {
        font-weight: 600;
        opacity: 0.7;
        font-size: 12px;
      }
      .status {
        font-size: 12px;
        opacity: 0.6;
      }
      .approval {
        border: 1px solid #d90;
        border-radius: 8px;
        padding: 8px 12px;
        margin: 8px 0;
      }
      .approval button {
        margin-right: 8px;
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #8884;
      }
      #input {
        flex: 1;
        padding: 8px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <header id="status">connecting…</header>
    <main id="log"></main>
    <footer>
      <input id="input" placeholder="发消息…（Enter 发送）" autofocus />
      <button id="send">发送</button>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
